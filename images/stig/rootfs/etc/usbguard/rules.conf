# RHEL-10-200562 (V-280964): USBGuard must have a policy of authorized devices.
# Shipped instead of `usbguard generate-policy`: at build time there are no
# devices, so a generated policy would block every keyboard on physical hosts.
# Allowed: USB hubs (class 09), and devices whose interfaces are ALL either
# human-interface (03: keyboards, mice) or smart card readers (0b: CAC/PIV,
# including keyboards with a built-in reader). Everything else, including USB
# mass storage, is blocked (ImplicitPolicyTarget=block).
# Site policy: the ISSO confirms this list (compliance/stig/controls.yaml).
allow with-interface match-all { 09:*:* }
allow with-interface match-all { 03:*:* 0b:*:* }
