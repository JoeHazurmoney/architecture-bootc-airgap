# RHEL-10-700430 (V-281268): the faillock records directory (dir= in
# /etc/security/faillock.conf) must carry the faillog_t SELinux label. The build
# adds the label rule; pam creates the directory at runtime, before that rule is
# applied, so create it here and relabel it on every boot.
d /var/log/faillock 0755 root root -
z /var/log/faillock - - - -
