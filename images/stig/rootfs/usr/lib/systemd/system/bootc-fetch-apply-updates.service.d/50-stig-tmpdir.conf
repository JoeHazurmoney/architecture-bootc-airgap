# STIG hosts mount /tmp noexec (RHEL-10-700155). From a service, bootc
# re-executes a copy of itself from $TMPDIR (SELinux install_t), which fails on
# a noexec /tmp. Give the update service a private runtime dir on /run instead.
[Service]
RuntimeDirectory=bootc-fetch-apply-updates
Environment=TMPDIR=/run/bootc-fetch-apply-updates
