---
# Hyper-V lab: AlmaLinux 10 stands in for RHEL 10.
# The control node is the tools container on bootc-lab-pxe (podman, host
# network), so everything here is reached over the isolated lab switch.
all:
  vars:
    ansible_user: labadmin
    ansible_ssh_private_key_file: "{{ lab_secrets_dir }}/id_ed25519"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ lab_secrets_dir }}/known_hosts
  hosts:
    # Explicit (not implicit) localhost, so inventory_dir and group_vars apply
    # to the control-node plays (lab CA, repo file).
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    pxe_servers:
      hosts:
        bootc-lab-pxe:
          ansible_host: 10.77.0.10
    bootc_build:
      hosts:
        bootc-lab-pxe:
    # Clients: FIPS-approved key (STIG hosts refuse Ed25519 in FIPS mode)
    bootc_fleet:
      vars:
        ansible_ssh_private_key_file: "{{ lab_secrets_dir }}/id_ecdsa"
      children:
        bootc_servers:
          hosts:
            bootc-lab-srv01:
              ansible_host: 10.77.0.101
        bootc_workstations:
          hosts:
            bootc-lab-ws01:
              ansible_host: 10.77.0.102
    # STIG comparison: a traditional RPM-installed host (lab_rpm_host.yml).
    # Not in bootc_fleet: Day-2 for it is dnf, not bootc.
    rpm_compare:
      vars:
        ansible_ssh_private_key_file: "{{ lab_secrets_dir }}/id_ecdsa"
      hosts:
        bootc-lab-rpm01:
          ansible_host: 10.77.0.103
