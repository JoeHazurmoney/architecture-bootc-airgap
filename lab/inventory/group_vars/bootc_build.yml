---
bootc_build_registry: "{{ lab_registry }}"
bootc_build_release: "10.2"
# v1.0 builds on the older mirrored base. The patch run passes
# -e lab_base_tag={{ lab_base_new }} to pick up six weeks of errata.
lab_base_tag: "{{ lab_base_old }}"
bootc_build_base_image: "{{ lab_registry }}/mirror/almalinux-bootc:{{ lab_base_tag }}"
bootc_build_bib_image: "{{ lab_registry }}/mirror/bootc-image-builder:lab"
bootc_build_registry_ca: "{{ lab_registry_ca }}"
bootc_build_registry_auth: "{{ lab_registry_auth }}"
bootc_build_disk_convert_vhdx: true
# RHEL-10-800040: chrony must use the site's time servers. In the lab that's
# the PXE VM (lab_site.yml lets chrony there serve the lab network).
bootc_build_args:
  NTP_SERVERS: "{{ lab_pxe_ip }}"
