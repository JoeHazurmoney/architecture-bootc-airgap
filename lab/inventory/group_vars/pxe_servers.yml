---
bootc_pxe_installer_release: "10.2"
bootc_pxe_installer_name: AlmaLinux 10.2
bootc_pxe_iso_path: "{{ lab_iso_path }}"
bootc_pxe_server_ip: "{{ lab_pxe_ip }}"
bootc_pxe_http_url: http://{{ lab_pxe_ip }}/bootc
bootc_pxe_allowed_networks: ["{{ lab_net_cidr }}"]

bootc_pxe_registry: "{{ lab_registry }}"
bootc_pxe_images:
  server:
    repository: bootc/server
    tag: stable
  workstation:
    repository: bootc/workstation
    tag: stable
  # STIG-hardened images (docs/stig/): FIPS installer + STIG disk layout
  # (bootc_pxe_partitioning_stig), and the admin must have a password.
  server-stig:
    repository: bootc/server-stig
    tag: stable
    stig: true
  workstation-stig:
    repository: bootc/workstation-stig
    tag: stable
    stig: true
bootc_pxe_registry_ca: "{{ lab_registry_ca }}"
bootc_pxe_registry_auth: "{{ lab_registry_auth }}"
bootc_pxe_ks_directive: ostreecontainer

bootc_pxe_admin_user: labadmin
# FIPS-mode (STIG) hosts refuse Ed25519, and Kickstart takes one sshkey per
# user, so the clients get the ECDSA P-384 key only.
bootc_pxe_admin_ssh_keys: "{{ [lab_admin_pubkey_fips or lab_admin_pubkey] | select | list }}"
bootc_pxe_admin_password_hash: "{{ lab_admin_password | password_hash('sha512', lab_admin_password_salt) }}"
# STIG boot loader password: the GRUB hash lab_rpm_lockdown.yml makes once
bootc_pxe_grub_password_hash: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/grub-pbkdf2', errors='ignore') | default('', true) }}"

# The lab switch is Private and isolated, so the PXE VM runs the only DHCP
# there. lab_site.yml finds the interface that holds lab_pxe_ip.
bootc_pxe_dhcp_mode: full
bootc_pxe_dhcp_interface: "{{ lab_iface | default('eth1') }}"
bootc_pxe_dhcp_range_start: 10.77.0.150
bootc_pxe_dhcp_range_end: 10.77.0.199
bootc_pxe_firewall_zone: internal

bootc_pxe_hosts:
  - name: bootc-lab-srv01
    mac: "02:00:77:00:00:65"
    profile: server-stig
    disk: sda
    ip: 10.77.0.101
    state: install
  - name: bootc-lab-ws01
    mac: "02:00:77:00:00:66"
    profile: workstation-stig
    disk: sda
    ip: 10.77.0.102
    state: install
    # Not `ks_directive: bootc`: Anaconda's bootc command doesn't support the
    # separate STIG mount points yet (only ostreecontainer does)
  # STIG comparison host: the traditional way (RPM Kickstart from the DVD repo,
  # hardened at install by the OpenSCAP add-on). Its Kickstart comes from
  # lab_rpm_host.yml; FIPS at install, as the STIG profile requires.
  - name: bootc-lab-rpm01
    mac: "02:00:77:00:00:67"
    disk: sda
    ip: 10.77.0.103
    state: install
    ks_url: http://{{ lab_pxe_ip }}/bootc/legacy/bootc-lab-rpm01.ks
    kernel_args: fips=1
