---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Services are running
      ansible.builtin.command:
        argv: [systemctl, is-active, httpd.service, tftp.socket, dnsmasq.service]
      changed_when: false

    - name: Kickstarts and GRUB files are served
      ansible.builtin.uri:
        url: "http://10.77.0.10/bootc/{{ item }}"
        status_code: 200
      loop:
        - ks/server.ks
        - ks/workstation.ks
        - ks/hosts/mol-srv01.ks
        - ks/hosts/mol-ws01.ks
        - EFI/BOOT/grub.cfg
        - EFI/BOOT/menu.cfg
        - EFI/BOOT/hosts/02:00:77:00:01:01.cfg
        - installer/10.2/images/pxeboot/vmlinuz

    - name: The installed-media marker is not served
      ansible.builtin.uri:
        url: http://10.77.0.10/bootc/installer/10.2/.bootc-pxe-media
        status_code: 403

    - name: Pull secret is served to the install network
      ansible.builtin.uri:
        url: http://10.77.0.10/bootc/trust/auth.json
        status_code: 200

    - name: Read the rendered files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/www/bootc/ks/hosts/mol-ws01.ks
        - /var/www/bootc/ks/hosts/mol-srv01.ks
        - /var/lib/tftpboot/bootc/EFI/BOOT/hosts/02:00:77:00:01:02.cfg
        - /etc/dnsmasq.d/bootc-pxe.conf
      register: __files

    - name: Content is what the inventory asked for
      ansible.builtin.assert:
        that:
          - "'bootc --source-imgref=registry:registry.molecule.test:5000/bootc/workstation:stable' in ws_ks"
          - "'ignoredisk --only-use=nvme0n1' in ws_ks"
          - "'ostreecontainer --url=registry.molecule.test:5000/bootc/server:stable --transport=registry' in srv_ks"
          - "'/etc/containers/certs.d/registry.molecule.test:5000/ca.crt' in srv_ks"
          - "'set default=\"local\"' in ws_grub"
          - "'dhcp-host=02:00:77:00:01:01,10.77.0.101,mol-srv01' in dnsmasq"
          - "'interface=bootc0' in dnsmasq"
      vars:
        ws_ks: "{{ __files.results[0].content | b64decode }}"
        srv_ks: "{{ __files.results[1].content | b64decode }}"
        ws_grub: "{{ __files.results[2].content | b64decode }}"
        dnsmasq: "{{ __files.results[3].content | b64decode }}"

    - name: Kickstarts pass ksvalidator (RHEL10 grammar)
      ansible.builtin.command:
        argv: [ksvalidator, -v, RHEL10, "{{ item }}"]
      loop:
        - /var/www/bootc/ks/server.ks
        - /var/www/bootc/ks/hosts/mol-ws01.ks
      changed_when: false

    - name: BIOS netboot dir was created
      ansible.builtin.stat:
        path: /var/lib/tftpboot/bootc/bios/i386-pc/core.0
      register: __core0
      failed_when: not __core0.stat.exists
