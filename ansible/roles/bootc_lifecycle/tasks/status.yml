---
- name: Run bootc status
  ansible.builtin.command:
    argv: [bootc, status, --format=json]
  register: __bootc_status
  changed_when: false
  become: true

- name: Parse bootc status
  ansible.builtin.set_fact:
    bootc_lifecycle_state:
      booted_ref: "{{ __s.status.booted.image.image.image | default('') if __s.status.booted else '' }}"
      booted_digest: "{{ __s.status.booted.image.imageDigest | default('') if __s.status.booted else '' }}"
      booted_version: "{{ __s.status.booted.image.version | default('') if __s.status.booted else '' }}"
      staged_digest: "{{ __s.status.staged.image.imageDigest | default('') if __s.status.staged else '' }}"
      rollback_digest: "{{ __s.status.rollback.image.imageDigest | default('') if __s.status.rollback else '' }}"
  vars:
    __s: "{{ __bootc_status.stdout | from_json }}"
